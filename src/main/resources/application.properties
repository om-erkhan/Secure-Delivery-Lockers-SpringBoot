spring.application.name=SecureDeliveryLockers
server.port=${PORT:8080}

# JWT Settings
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Database Settings (Supabase PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Settings (Cloud integration ready)
spring.data.redis.url=${REDIS_URL}

# RabbitMQ Settings (Cloud integration ready)
spring.rabbitmq.addresses=${CLOUDAMQP_URL}

# Supabase S3-Compatible Storage Settings
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT}
supabase.s3.bucket-name=${SUPABASE_S3_BUCKET_NAME}
supabase.s3.url=${SUPABASE_S3_URL}
supabase.s3.region=${SUPABASE_S3_REGION}
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY}

# Mail Settings (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
